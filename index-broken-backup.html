<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホでの拡大縮小を防止するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>てんこう2 WebAR 最小プロトタイプ</title>
  <link rel="stylesheet" href="./css/style.css">

  <!-- A-Frame 1.6.0（AR.jsより先に読み込む） -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- AR.js 3.4.8（マーカートラッキング版） -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
</head>
<body>
  <!-- debug-custom.htmlで動作確認済みの構成をそのまま採用（a-scene設定は変更しない） -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <!-- カスタムマーカー（pattern形式、実寸15cm角） -->
    <a-marker
      id="tenkoh2-marker"
      type="pattern"
      url="./assets/markers/tenkoh2-marker.patt"
      size="0.15"
      patternRatio="0.5"
      emitevents="true"
    >
      <!--
        実寸 幅0.30m×高さ0.10m×奥行0.20mの灰色の直方体
        底面がマーカー面から5cm浮くよう、中心Y座標を0.10mに設定
        （高さ0.10mの半分0.05m + 浮かせる0.05m = 0.10m）
      -->
      <a-box
        width="0.30"
        height="0.10"
        depth="0.20"
        position="0 0.10 0"
        color="gray"
      ></a-box>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- 画面下部の案内テキスト -->
  <div id="guide-text">カードのマーカー全体を映してください</div>

  <script src="./js/ar.js"></script>
</body>
</html>
