<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>診断用：カスタムマーカー最小構成</title>
  <!-- bodyのみ最小限のリセット。video/canvas/a-sceneへの独自スタイルは一切当てない -->
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>

  <!-- A-Frame 1.6.0 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- AR.js 3.4.8（マーカートラッキング版） -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
</head>
<body>
  <!-- debug-hiro.htmlと同じ最小構成で、マーカーだけカスタムパターンに変更 -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >
    <!-- カスタムマーカー（pattern形式、実寸15cm、patternRatioは0.5で診断） -->
    <a-marker
      id="debug-custom-marker"
      type="pattern"
      url="./assets/markers/tenkoh2-marker.patt"
      size="0.15"
      patternRatio="0.5"
      emitevents="true"
    >
      <!--
        AR.js 3.4.8のA-Frame実装ではa-markerのsize="0.15"が
        markerParametersへ反映されず、マーカー幅が1単位として扱われるため、
        実寸をマーカー幅1.0単位に対する比率で指定する。
        換算：30cm=2.0 / 20cm=1.333333 / 10cm=0.666667 / 5cm=0.333333

        位置・回転・傾きは親要素で分担して管理し、箱自身には持たせない。
        satellite-position …高さ（0.90 = 20度傾けても底面とカード面の間に
                              約5cm以上の隙間が残る高さ）
        satellite-spinner  …マーカー面に垂直なY軸まわりの回転（20秒で1周）
        satellite-tilt     …固定された傾き（アニメーションさせない）
      -->
      <a-entity id="satellite-position" position="0 0.90 0">
        <a-entity
          id="satellite-spinner"
          animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 20000; easing: linear; loop: true"
        >
          <a-entity id="satellite-tilt" rotation="20 0 0">
            <a-box
              id="satellite-placeholder"
              width="2"
              height="0.666667"
              depth="1.333333"
              position="0 0 0"
              rotation="0 0 0"
              scale="1 1 1"
              color="#808080"
            ></a-box>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- 診断用：markerFound/markerLostをコンソールに出力するだけ。video/canvas操作やリロードは行わない -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var marker = document.querySelector('#debug-custom-marker');
      if (!marker) {
        console.log('診断: マーカー要素が見つかりません');
        return;
      }
      marker.addEventListener('markerFound', function () {
        console.log('診断: markerFound（カスタムマーカーを検出）');
      });
      marker.addEventListener('markerLost', function () {
        console.log('診断: markerLost（カスタムマーカーを見失った）');
      });
    });
  </script>
</body>
</html>
